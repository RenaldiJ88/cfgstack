[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfgstack"
version = "0.3.1"
description = "Layered configuration resolution with explicit override semantics"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "The cfgstack authors", email = "maintainers@cfgstack.example" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://example.invalid/cfgstack"

[tool.setuptools]
packages = ["cfgstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
